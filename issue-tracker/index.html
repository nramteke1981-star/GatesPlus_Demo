<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GatedPlus Issue Tracker</title>
<style>
:root{--blue:#234b86;--green:#4c913b;--ink:#17243a;--muted:#617089;--line:#d8e0ec;--bg:#f3f6fa;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Arial,sans-serif;color:var(--ink)}.wrap{max-width:1180px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #17335d14;margin-bottom:18px;overflow:hidden}.head{padding:24px 28px;border-top:6px solid var(--green);display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:38px;font-weight:800;letter-spacing:-2px;color:var(--green)}.brand span{color:var(--blue)}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted)}.body{padding:24px 28px}h2{font-size:18px;margin:0 0 16px;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.req:after{content:" *";color:var(--red)}input,select,textarea{width:100%;border:1px solid #bcc8d8;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid #a8c4e9;border-color:var(--blue)}input[readonly]{background:#eef2f7;color:#4b5b70}textarea{min-height:90px;resize:vertical}.pinrow{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:500px}.btn{border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:11px 18px;cursor:pointer}.btn.secondary{background:#e8eef7;color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.msg{margin-top:9px;font-weight:700}.error{color:var(--red)}.ok{color:#287a2e}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:900px}th{background:var(--blue);color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid var(--line);vertical-align:top}.smallbtn{padding:7px 11px;font-size:12px}.empty{padding:20px;text-align:center;color:var(--muted)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{display:block}.brand{margin-bottom:10px}.body{padding:20px}.pinrow{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<section class="card head"><div class="brand">gated<span>PLUS</span></div><div><h1>Team Issue Tracker</h1><div class="sub">Report, assign and follow issues to closure.</div></div></section>
<section class="card"><div class="body"><h2>Enter your PIN</h2><div class="pinrow"><input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off"><button class="btn" id="load">Continue</button></div><div id="pinMsg" class="msg"></div></div></section>
<section class="card" id="listCard" hidden><div class="body"><h2>All open team issues</h2><div class="tablewrap"><table><thead><tr><th>Issue ID</th><th>Title</th><th>Project</th><th>Severity</th><th>Status</th><th>Assigned To</th><th>Target Date</th><th></th></tr></thead><tbody id="issues"></tbody></table></div></div></section>
<section class="card" id="formCard" hidden><div class="body"><h2 id="formTitle">Report an issue</h2><form id="form"><input type="hidden" id="recordId"><div class="grid">
<div><label>Issue ID</label><input id="issueId" readonly placeholder="Generated after submission"></div>
<div><label class="req">Reported Date</label><input id="reportedDate" type="date" required></div>
<div><label>Reported By</label><input id="reportedBy" readonly></div>
<div><label class="req">Project / Workstream</label><select id="project" required></select></div>
<div class="full"><label class="req">Issue Title</label><input id="issueTitle" maxlength="160" required></div>
<div class="full"><label class="req">Issue Description</label><textarea id="issueDescription" required></textarea></div>
<div><label class="req">Severity</label><select id="severity" required></select></div>
<div><label class="req">Priority</label><select id="priority" required></select></div>
<div><label class="req">Status</label><select id="status" required></select></div>
<div><label class="req">Assigned To</label><select id="assignedTo" required></select></div>
<div><label class="req">Issue Category</label><select id="issueCategory" required></select></div>
<div><label class="req">Target Resolution Date</label><input id="targetResolutionDate" type="date" required></div>
<div class="full"><label>Root Cause</label><textarea id="rootCause"></textarea></div>
<div class="full"><label>Resolution / Action Taken</label><textarea id="resolutionAction"></textarea></div>
<div class="full"><label>Support Required</label><textarea id="supportRequired"></textarea></div>
<div class="full"><label>Attachment Link</label><input id="attachmentLink" type="url" placeholder="https://..."></div>
</div><div id="saveMsg" class="msg"></div><div class="actions"><button type="button" class="btn secondary" id="clear">Clear</button><button type="submit" class="btn" id="submit" disabled>Submit issue</button></div></form></div></section>
</main>
<script>
const API="https://gatedplus-team-update.nramteke.chatgpt.site";const $=id=>document.getElementById(id);let currentPin="",currentMember="",issueRows=[];
const fields=["reportedDate","project","issueTitle","issueDescription","severity","priority","status","assignedTo","issueCategory","targetResolutionDate"];
function options(id,values,preferred=""){const el=$(id);el.innerHTML='<option value="">Select...</option>'+values.map(v=>'<option>'+esc(v)+'</option>').join("");if(preferred&&values.includes(preferred))el.value=preferred}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function validate(){const ok=currentPin&&fields.every(id=>$(id).value.trim())&&$("form").checkValidity();$("submit").disabled=!ok;return ok}
async function request(path,opts={}){const r=await fetch(API+path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong.");return d}
async function load(){const pin=$("pin").value.trim();$("pinMsg").textContent="";if(!/^\d{6}$/.test(pin)){show("pinMsg","Enter your valid 6-digit PIN.","error");return} $("load").disabled=true;try{const [master,list]=await Promise.all([request("/api/master-data"),request("/api/issues",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"list",pin})})]);currentPin=pin;currentMember=list.member;$("reportedBy").value=currentMember;options("project",master.projects||[]);options("severity",master.issueSeverities||[]);options("priority",master.priorities||[]);options("status",master.issueStatuses||[],"Open");options("assignedTo",master.teamMembers||[]);options("issueCategory",master.issueCategories||[]);issueRows=list.issues||[];render();reset(false);$("listCard").hidden=false;$("formCard").hidden=false;show("pinMsg","PIN verified for "+currentMember+".","ok")}catch(e){currentPin="";$("listCard").hidden=true;$("formCard").hidden=true;show("pinMsg",e.message,"error")}finally{$("load").disabled=false}}
function render(){const body=$("issues");if(!issueRows.length){body.innerHTML='<tr><td colspan="8" class="empty">No open issues found.</td></tr>';return}body.innerHTML=issueRows.map((x,i)=>'<tr><td>'+esc(x.issueId)+'</td><td>'+esc(x.issueTitle)+'</td><td>'+esc(x.project)+'</td><td>'+esc(x.severity)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.assignedTo)+'</td><td>'+esc(x.targetResolutionDate)+'</td><td><button class="btn smallbtn" data-i="'+i+'">Update</button></td></tr>').join("")}
function edit(i){const x=issueRows[i];["recordId","issueId","reportedDate","project","issueTitle","issueDescription","severity","priority","status","assignedTo","issueCategory","targetResolutionDate","rootCause","resolutionAction","supportRequired","attachmentLink"].forEach(id=>$(id).value=x[id]||"");$("reportedBy").value=x.reportedBy||currentMember;$("formTitle").textContent="Update "+(x.issueId||"issue");$("submit").textContent="Submit update";validate();$("formCard").scrollIntoView({behavior:"smooth"})}
function reset(scroll=true){$("form").reset();$("recordId").value="";$("issueId").value="";$("reportedBy").value=currentMember;$("reportedDate").value=new Date().toISOString().slice(0,10);$("status").value="Open";$("formTitle").textContent="Report an issue";$("submit").textContent="Submit issue";$("saveMsg").textContent="";validate();if(scroll)$("formCard").scrollIntoView({behavior:"smooth"})}
async function save(e){e.preventDefault();if(!validate())return;const payload={pin:currentPin};["recordId","reportedDate","project","issueTitle","issueDescription","severity","priority","status","assignedTo","issueCategory","targetResolutionDate","rootCause","resolutionAction","supportRequired","attachmentLink"].forEach(id=>payload[id]=$(id).value.trim());$("submit").disabled=true;show("saveMsg","Saving...","");try{const d=await request("/api/issues",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});show("saveMsg",(payload.recordId?"Issue updated: ":"Issue created: ")+(d.issueId||""),"ok");const list=await request("/api/issues",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"list",pin:currentPin})});issueRows=list.issues||[];render();reset(false)}catch(e){show("saveMsg",e.message,"error")}finally{validate()}}
function show(id,text,cls){const e=$(id);e.textContent=text;e.className="msg "+cls}
$("load").onclick=load;$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")load()});$("issues").onclick=e=>{const b=e.target.closest("button[data-i]");if(b)edit(Number(b.dataset.i))};$("form").addEventListener("input",validate);$("form").onsubmit=save;$("clear").onclick=()=>reset();
</script></body></html>
